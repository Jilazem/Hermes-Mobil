<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Fikir Kapışması</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f13; }
    /* Canvas boyutu JS'te satır içi yazılır (tur-9 ölçümü: yüzde zinciri emülatörde
       0 yükseklik bırakabiliyordu). */
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #fallback {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: #7b8894; font: 13px -apple-system, "Roboto", sans-serif; text-align: center;
    }
    #debate-hud { position: fixed; inset: 0; pointer-events: none; color: #fff2e8;
      font: 11px system-ui, -apple-system, Roboto, sans-serif; padding: 10px; box-sizing: border-box; }
    .scene-heading { display: flex; justify-content: space-between; font-size: 10px;
      font-weight: 800; letter-spacing: .12em; margin-bottom: 9px; color: #c2c9ec; }
    #scene-phase { color: #8fe8d7; }
    .debaters { display: flex; gap: 12px; }
    .debater { flex: 1; min-width: 0; border-radius: 14px 14px 4px 14px; padding: 9px;
      background: rgba(21, 30, 53, .88); border: 1px solid rgba(132, 217, 238, .45); }
    .peach { border-color: rgba(255, 196, 138, .5); border-radius: 14px 14px 14px 4px; }
    .caption-head { display: flex; justify-content: space-between; gap: 3px; align-items: center; }
    .caption-head b { color: #9ae7f4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .peach b { color: #ffd3a6; }
    .caption-head span { font-size: 9px; white-space: nowrap; opacity: .8; }
    .quote { margin: 5px 0; font-size: 11px; line-height: 1.45; display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    small { color: #a8b5d1; font-size: 9px; }
    #scene-note { position: absolute; bottom: 8px; left: 10px; right: 10px; text-align: center;
      color: #bec8e3; font-size: 9px; }
    #participants { position: absolute; bottom: 28px; left: 10px; right: 10px; text-align: center; color: #f3d6a0; }
    #scene-empty { position: absolute; top: 40%; left: 24px; right: 24px; text-align: center;
      color: #c4cce0; font-size: 13px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="fallback">3D sahne bu cihazda calismiyor</div>
  <!-- three.js r147 (MIT) — uygulama asset'i, çalışma anında indirme YOK. -->
  <script src="three.min.js"></script>
  <script src="cage-engine.js"></script>
  <script src="cage.js"></script>
</body>
</html>
